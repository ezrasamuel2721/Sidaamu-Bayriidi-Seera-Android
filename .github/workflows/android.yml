name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download production web app
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 "https://sidaamu-bayriidi-seera.vercel.app/" -o app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sidaamu-bayriidi-seera-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
